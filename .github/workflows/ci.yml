name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    name: Type-check & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Require a changeset
        if: >-
          github.event_name == 'pull_request' &&
          (
            github.event.pull_request.head.ref != 'changeset-release/main' ||
            github.event.pull_request.head.repo.full_name != github.repository
          )
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changeset_files="$(git diff --name-only --diff-filter=AM "$BASE_SHA...$HEAD_SHA" -- '.changeset/*.md' ':!.changeset/README.md')"
          if [ -z "$changeset_files" ]; then
            echo "::error::This pull request needs a changeset. Run 'npm run changeset', or use 'npm run changeset:empty' when no version bump is needed."
            exit 1
          fi
          npm run changeset:status -- --since "$BASE_SHA"

      - name: Type-check
        run: npm run type-check

      - name: Build
        run: npm run build
        env:
          # Provide a dummy SHA so the footer renders during CI builds
          NEXT_PUBLIC_COMMIT_SHA: ${{ github.sha }}
