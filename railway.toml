[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"
# Only redeploy when source files change, not when docs or config files do
watchPatterns = [
  "src/**",
  "lexicons/**",
  "scripts/**",
  "package.json",
  "package-lock.json",
  "Dockerfile",
  "railway.toml",
  "tsconfig.json",
]

[deploy]
# SQLite requires exactly one instance — do not increase this
numReplicas = 1
healthcheckPath = "/api/stats"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 5
